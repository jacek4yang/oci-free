name: Finish PR 8 branch v3

on:
  push:
    branches: [feat/reset-host-customization]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reset-host-customization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex anchor not found: {pattern[:100]!r}")
              p.write_text(updated)

          # Fresh retry token per logical create. OciClient keeps the same token
          # for transport retries because the RequestBody owns it for that call.
          p = Path("src/commands/vmnet.rs")
          text = p.read_text()
          if "fn retry_nonce()" not in text:
              replace_once(
                  p,
                  "use serde::Serialize;\n",
                  "use std::{\n"
                  "    sync::atomic::{AtomicU64, Ordering},\n"
                  "    time::{SystemTime, UNIX_EPOCH},\n"
                  "};\n\n"
                  "use ring::rand::{SecureRandom, SystemRandom};\n"
                  "use serde::Serialize;\n",
              )
              regex_once(
                  p,
                  r"/// A stable idempotency token, so a replayed create does not duplicate\.\n"
                  r"#\[must_use\]\n"
                  r"pub fn retry_token\(kind: &str, seed: &str\) -> String \{.*?\n\}\n",
                  '''/// Fallback uniqueness when the operating-system RNG is temporarily unavailable.
          static RETRY_NONCE_FALLBACK: AtomicU64 = AtomicU64::new(1);

          fn retry_nonce() -> u64 {
              let mut bytes = [0_u8; 8];
              if SystemRandom::new().fill(&mut bytes).is_ok() {
                  return u64::from_le_bytes(bytes);
              }

              // The retry token is not a credential. This fallback only prevents
              // accidental token reuse when OS randomness is temporarily unavailable.
              let clock = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .map_or(0, |duration| {
                      duration.as_secs().rotate_left(32) ^ u64::from(duration.subsec_nanos())
                  });
              clock ^ RETRY_NONCE_FALLBACK.fetch_add(1, Ordering::Relaxed)
          }

          /// An OCI idempotency token scoped to one logical create invocation.
          ///
          /// The caller constructs this once and passes it into `OciClient`, whose
          /// transport retries therefore reuse the same token. A later CLI invocation
          /// gets a fresh nonce, which matters because OCI can invalidate an old retry
          /// token after the resource created with it is deleted.
          #[must_use]
          pub fn retry_token(kind: &str, seed: &str) -> String {
              let digest = seed.bytes().fold(0_u32, |acc, byte| {
                  acc.wrapping_mul(31).wrapping_add(u32::from(byte))
              });
              format!("oci-free-{kind}-{digest:08x}-{:016x}", retry_nonce())
          }
          ''')

          p = Path("src/commands/vmnet.rs")
          text = p.read_text()
          text = text.replace(
              "re-run the same command: the create carries an idempotency token, so it reuses this \\\n         group rather than making a second one",
              "re-run the same command: discovery reuses the tagged group if it still exists; if \\\n         it was deleted, the new create receives a fresh OCI retry token",
          )
          p.write_text(text)

          # Remove rand 0.10, which currently resolves through yanked chacha20 0.10.1.
          p = Path("Cargo.toml")
          text = p.read_text()
          text = text.replace("# Retry jitter only. Not used for anything security-sensitive.\n", "")
          text = re.sub(r'^rand = \{ version = "0\.10".*?\}\n', '', text, flags=re.M)
          p.write_text(text)

          p = Path("src/oci/client.rs")
          text = p.read_text()
          if "fn retry_jitter()" not in text:
              text = text.replace(
                  "use reqwest::{StatusCode, header};\n",
                  "use reqwest::{StatusCode, header};\nuse ring::rand::{SecureRandom, SystemRandom};\n",
                  1,
              )
              anchor = 'const NEXT_PAGE_HEADER: &str = "opc-next-page";\n'
              helper = '''const NEXT_PAGE_HEADER: &str = "opc-next-page";

          /// Retry jitter in `[0, 1]`. Jitter is not security-sensitive; `0.5`
          /// is a safe deterministic fallback if platform randomness is unavailable.
          fn retry_jitter() -> f64 {
              let mut bytes = [0_u8; 8];
              if SystemRandom::new().fill(&mut bytes).is_err() {
                  return 0.5;
              }
              let sample = u64::from_le_bytes(bytes);
              sample as f64 / u64::MAX as f64
          }
          '''
              if anchor not in text:
                  raise SystemExit("client.rs: NEXT_PAGE_HEADER anchor not found")
              text = text.replace(anchor, helper, 1)
          text = text.replace(
              "let jitter: f64 = rand::random_range(0.0..1.0);",
              "let jitter = retry_jitter();",
          )
          p.write_text(text)

          # Destructive reset targets must all be inventoried before approval.
          p = Path("src/commands/reset.rs")
          text = p.read_text()
          if "boot_volumes: Vec<crate::oci::block_storage::BootVolume>" not in text:
              text = text.replace(
                  "struct Inventory {\n    instances: Vec<Instance>,\n",
                  "struct Inventory {\n    instances: Vec<Instance>,\n    boot_volumes: Vec<crate::oci::block_storage::BootVolume>,\n",
                  1,
              )
              text = text.replace(
                  "    let compute = ComputeApi::new(context.client());\n    let network = NetworkApi::new(context.client());\n\n    let instances = compute\n",
                  "    let compute = ComputeApi::new(context.client());\n"
                  "    let network = NetworkApi::new(context.client());\n"
                  "    let identity = IdentityApi::new(context.client());\n"
                  "    let block = BlockStorageApi::new(context.client());\n\n"
                  "    let instances = compute\n",
                  1,
              )
              marker = "    let nsgs = network\n"
              boot_discovery = '''    let mut boot_volumes = Vec::new();
              for domain in identity.list_availability_domains(context.tenancy()).await? {
                  boot_volumes.extend(
                      block
                          .list_boot_volumes(context.tenancy(), &domain.name)
                          .await?
                          .into_iter()
                          .filter(|volume| {
                              classify(&volume.freeform_tags).permits_deletion()
                                  && volume.consumes_storage()
                          }),
                  );
              }

              let nsgs = network
          '''
              if marker not in text:
                  raise SystemExit("reset.rs: NSG discovery anchor not found")
              text = text.replace(marker, boot_discovery, 1)
              text = text.replace(
                  "    Ok(Inventory {\n        instances,\n        nsgs,\n",
                  "    Ok(Inventory {\n        instances,\n        boot_volumes,\n        nsgs,\n",
                  1,
              )
              plan_anchor = "    for nsg in &inventory.nsgs {\n"
              boot_plan = '''    for volume in &inventory.boot_volumes {
                  plan.add_change(
                      PlannedChange::new(
                          ChangeKind::Delete,
                          "boot volume",
                          volume.label(),
                          "deleted if it still exists after instance termination",
                      )
                      .with_id(volume.id.clone())
                      .with_ownership(classify(&volume.freeform_tags)),
                  );
              }
              for nsg in &inventory.nsgs {
          '''
              if plan_anchor not in text:
                  raise SystemExit("reset.rs: plan NSG anchor not found")
              text = text.replace(plan_anchor, boot_plan, 1)

              start_apply = text.find("    // A retained boot volume from an earlier failed/manual test can outlive its")
              end_apply = text.find("    for nsg in &inventory.nsgs {", start_apply)
              if start_apply == -1 or end_apply == -1:
                  raise SystemExit("reset.rs: old boot-volume apply block not found")
              replacement = '''    // Boot volumes were inventoried before confirmation, so every destructive
              // target is represented in the approved plan. A volume already removed by
              // instance termination returns NotFound and is treated as clean.
              let block = BlockStorageApi::new(context.client());
              for volume in &inventory.boot_volumes {
                  match delete_boot_until_gone(context, &block, &volume.id).await {
                      Ok(()) => resources.push(deleted_outcome(
                          "boot volume",
                          &volume.id,
                          volume.display_name.clone(),
                      )),
                      Err(error) => {
                          warnings.push(format!(
                              "boot volume {} could not be deleted: {error}",
                              volume.id
                          ));
                          resources.push(failed(
                              "boot volume",
                              &volume.id,
                              volume.display_name.clone(),
                              &error,
                          ));
                      }
                  }
              }

          '''
              text = text[:start_apply] + replacement + text[end_apply:]

              helper_start = text.find("async fn delete_managed_boot_volumes(")
              helper_end = text.find("async fn delete_boot_until_gone(")
              if helper_start == -1 or helper_end == -1 or helper_end <= helper_start:
                  raise SystemExit("reset.rs: boot-volume helper boundaries not found")
              text = text[:helper_start] + text[helper_end:]
          p.write_text(text)

          # OCI VNIC hostname labels start with a lowercase ASCII letter.
          p = Path("src/commands/create.rs")
          text = p.read_text()
          text = text.replace("&& bytes[0].is_ascii_alphanumeric()", "&& bytes[0].is_ascii_lowercase()")
          text = text.replace(
              "use 1-63 lowercase ASCII letters, digits, or `-`, with an alphanumeric first and last character",
              "use 1-63 lowercase ASCII letters, digits, or `-`; start with a lowercase letter and end with a letter or digit",
          )
          p.write_text(text)

          # Correct stale NSG URI tests and old deterministic-token assumptions.
          p = Path("src/commands/vmnet_tests.rs")
          text = p.read_text()
          text = text.replace(
              "/networkSecurityGroups/{MANAGED_NSG_ID}/securityRules/actions/addSecurityRules",
              "/networkSecurityGroups/{MANAGED_NSG_ID}/actions/addSecurityRules",
          )
          text = text.replace(
              "/networkSecurityGroups/{MANAGED_NSG_ID}/securityRules/actions/removeSecurityRules",
              "/networkSecurityGroups/{MANAGED_NSG_ID}/actions/removeSecurityRules",
          )
          text = re.sub(
              r"#\[test\]\nfn retry_tokens_are_stable_per_operation_and_distinct_across_them\(\) \{.*?\n\}\n",
              '''#[test]
          fn retry_tokens_are_fresh_across_logical_create_attempts() {
              let first = retry_token("nsg", INSTANCE_ID);
              let second = retry_token("nsg", INSTANCE_ID);
              assert_ne!(first, second);
              assert!(first.starts_with("oci-free-nsg-"));
              assert!(second.starts_with("oci-free-nsg-"));
              assert!(first.len() <= 64);
              assert!(second.len() <= 64);
          }
          ''',
              text,
              count=1,
              flags=re.S,
          )
          # A previous patch attempt may have appended a duplicate fresh-token test.
          matches = list(re.finditer(r"#\[test\]\nfn retry_tokens_are_fresh_across_create_attempts\(\) \{.*?\n\}\n", text, flags=re.S))
          for match in reversed(matches):
              text = text[:match.start()] + text[match.end():]
          text = text.replace(
              'error.remediation().contains("idempotency token")',
              'error.remediation().contains("tagged group")',
          )
          p.write_text(text)

          # vm ssh must honor the username persisted by vm create.
          p = Path("src/commands/ssh_tests.rs")
          text = p.read_text()
          if "a_custom_launch_username_is_reused_by_vm_ssh" not in text:
              marker = "#[tokio::test]\nasync fn ubuntu_images_use_the_ubuntu_login_name() {\n"
              if marker not in text:
                  raise SystemExit("ssh_tests.rs: Ubuntu test anchor not found")
              test = '''#[tokio::test]
          async fn a_custom_launch_username_is_reused_by_vm_ssh() {
              let mock = mock(Some("203.0.113.17"), "Oracle Linux").await;
              let mut instance: crate::oci::compute::Instance =
                  serde_json::from_value(instance_json()).expect("instance");
              instance
                  .freeform_tags
                  .insert("oci-free:ssh-user".to_owned(), "jacek".to_owned());

              let (user, warning) = default_user(&context(&mock), &instance).await;
              assert_eq!(user, "jacek");
              assert!(warning.is_none());
          }

          '''
              text = text.replace(marker, test + marker, 1)
          p.write_text(text)
          PY

          cargo fmt --all
          cargo check
          if grep -q '^name = "chacha20"$' Cargo.lock; then
            echo "chacha20 remains in Cargo.lock after rand removal" >&2
            cargo tree -i chacha20 || true
            exit 1
          fi
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --locked
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finish-pr8.yml .github/workflows/finish-pr8-v2.yml .github/workflows/finish-pr8-v3.yml
          git add Cargo.toml Cargo.lock src
          git commit -m "fix: complete reset safety and retry semantics"
          git push origin HEAD:feat/reset-host-customization
