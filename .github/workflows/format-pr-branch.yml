name: Format PR branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fmt:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/reset-host-customization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format Rust sources"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
