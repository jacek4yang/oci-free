name: Generate lockfile (temporary)

on:
  pull_request:
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: generate release lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
