name: Finish PR 8 branch

on:
  push:
    branches: [feat/reset-host-customization]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reset-host-customization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final safety and regression patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {actual}")
              p.write_text(text.replace(old, new, count))

          # A retry token is idempotent only inside one logical HTTP operation.
          # New CLI invocations must not reuse a token whose old resource was deleted.
          replace(
              "src/commands/vmnet.rs",
              '''/// A stable idempotency token, so a replayed create does not duplicate.
          #[must_use]
          pub fn retry_token(kind: &str, seed: &str) -> String {
              // OCI compares the token verbatim, so it must be stable for the same
              // logical operation and different for a different one.
              let digest = seed.bytes().fold(0u64, |acc, byte| {
                  acc.wrapping_mul(31).wrapping_add(u64::from(byte))
              });
              format!("oci-free-{kind}-{digest:016x}")
          }
          ''',
              '''/// A fresh OCI idempotency token for one logical create call.
          ///
          /// The returned string is passed once into `OciClient`; transport retries of
          /// that call therefore reuse the same token, while a later CLI invocation
          /// receives a new token. OCI can invalidate a token after the resource it
          /// created is deleted, so deriving it permanently from a display name is
          /// incorrect.
          #[must_use]
          pub fn retry_token(kind: &str, seed: &str) -> String {
              let seed_digest = seed.bytes().fold(0u32, |acc, byte| {
                  acc.wrapping_mul(31).wrapping_add(u32::from(byte))
              });
              let nonce_hi: u64 = rand::random();
              let nonce_lo: u32 = rand::random();
              // OCI retry tokens are bounded; all current `kind` values keep this well
              // below 64 characters while retaining a 96-bit invocation nonce.
              format!("oci-free-{kind}-{seed_digest:08x}-{nonce_hi:016x}{nonce_lo:08x}")
          }
          ''')

          replace(
              "src/commands/vmnet.rs",
              '''        "re-run the same command: the create carries an idempotency token, so it reuses this \\
                   group rather than making a second one",
          ''',
              '''        "re-run the same command: discovery will reuse this tagged group if it still exists; \\
                   if it was deleted, the new create attempt receives a fresh OCI retry token",
          ''')

          # Retry-token regression: same logical name on a later create must get a new token.
          p = Path("src/commands/vmnet_tests.rs")
          text = p.read_text()
          marker = "\n// -- show -------------------------------------------------------------------\n"
          if "retry_tokens_are_fresh_across_create_attempts" not in text:
              insert = '''
          #[test]
          fn retry_tokens_are_fresh_across_create_attempts() {
              let first = retry_token("nsg", "same-resource-name");
              let second = retry_token("nsg", "same-resource-name");
              assert_ne!(first, second, "a later create must not reuse an invalidated token");
              assert!(first.len() <= 64);
              assert!(second.len() <= 64);
              assert!(first.starts_with("oci-free-nsg-"));
          }
          '''
              if marker not in text:
                  raise SystemExit("vmnet_tests marker not found")
              p.write_text(text.replace(marker, insert + marker, 1))

          # The destructive reset plan must inventory boot volumes before approval.
          replace(
              "src/commands/reset.rs",
              '''struct Inventory {
              instances: Vec<Instance>,
              nsgs: Vec<crate::oci::network::NetworkSecurityGroup>,
              vcns: Vec<crate::oci::network::Vcn>,
              subnets: Vec<crate::oci::network::Subnet>,
              gateways: Vec<crate::oci::network::InternetGateway>,
          }
          ''',
              '''struct Inventory {
              instances: Vec<Instance>,
              boot_volumes: Vec<crate::oci::block_storage::BootVolume>,
              nsgs: Vec<crate::oci::network::NetworkSecurityGroup>,
              vcns: Vec<crate::oci::network::Vcn>,
              subnets: Vec<crate::oci::network::Subnet>,
              gateways: Vec<crate::oci::network::InternetGateway>,
          }
          ''')

          replace(
              "src/commands/reset.rs",
              '''    let compute = ComputeApi::new(context.client());
              let network = NetworkApi::new(context.client());
          ''',
              '''    let compute = ComputeApi::new(context.client());
              let network = NetworkApi::new(context.client());
              let identity = IdentityApi::new(context.client());
              let block = BlockStorageApi::new(context.client());
          ''')

          replace(
              "src/commands/reset.rs",
              '''    let nsgs = network
          ''',
              '''    let mut boot_volumes = Vec::new();
              for domain in identity
                  .list_availability_domains(context.tenancy())
                  .await?
              {
                  boot_volumes.extend(
                      block
                          .list_boot_volumes(context.tenancy(), &domain.name)
                          .await?
                          .into_iter()
                          .filter(|volume| {
                              classify(&volume.freeform_tags).permits_deletion()
                                  && volume.consumes_storage()
                          }),
                  );
              }

              let nsgs = network
          ''')

          replace(
              "src/commands/reset.rs",
              '''    Ok(Inventory {
                  instances,
                  nsgs,
          ''',
              '''    Ok(Inventory {
                  instances,
                  boot_volumes,
                  nsgs,
          ''')

          replace(
              "src/commands/reset.rs",
              '''    for nsg in &inventory.nsgs {
          ''',
              '''    for volume in &inventory.boot_volumes {
                  plan.add_change(
                      PlannedChange::new(
                          ChangeKind::Delete,
                          "boot volume",
                          volume.label(),
                          "deleted if it still exists after instance termination",
                      )
                      .with_id(volume.id.clone())
                      .with_ownership(classify(&volume.freeform_tags)),
                  );
              }
              for nsg in &inventory.nsgs {
          ''',
              count=1)

          replace(
              "src/commands/reset.rs",
              '''    // A retained boot volume from an earlier failed/manual test can outlive its
              // instance. Delete only volumes carrying oci-free's Created ownership tag.
              if let Err(error) = delete_managed_boot_volumes(context, &mut resources, &mut warnings).await {
                  warnings.push(format!(
                      "managed boot-volume discovery was incomplete: {error}"
                  ));
              }

          ''',
              '''    // Boot volumes were discovered before confirmation, so no destructive write
              // can appear after the user approved the plan. A volume already removed by
              // instance termination simply returns NotFound and counts as clean.
              let block = BlockStorageApi::new(context.client());
              for volume in &inventory.boot_volumes {
                  match delete_boot_until_gone(context, &block, &volume.id).await {
                      Ok(()) => resources.push(deleted_outcome(
                          "boot volume",
                          &volume.id,
                          volume.display_name.clone(),
                      )),
                      Err(error) => {
                          warnings.push(format!(
                              "boot volume {} could not be deleted: {error}",
                              volume.id
                          ));
                          resources.push(failed(
                              "boot volume",
                              &volume.id,
                              volume.display_name.clone(),
                              &error,
                          ));
                      }
                  }
              }

          ''')

          start = '''async fn delete_managed_boot_volumes(
          '''
          end = '''async fn delete_boot_until_gone(
          '''
          p = Path("src/commands/reset.rs")
          text = p.read_text()
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("reset boot-volume helper boundaries not found")
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          p.write_text(before + end + after)

          # OCI VNIC hostname labels are deliberately validated conservatively.
          replace(
              "src/commands/create.rs",
              '''        && bytes[0].is_ascii_alphanumeric()
          ''',
              '''        && bytes[0].is_ascii_lowercase()
          ''')
          replace(
              "src/commands/create.rs",
              '''        .with_context("use 1-63 lowercase ASCII letters, digits, or `-`, with an alphanumeric first and last character")
          ''',
              '''        .with_context("use 1-63 lowercase ASCII letters, digits, or `-`; start with a lowercase letter and end with a letter or digit")
          ''')

          # vm ssh must use the username recorded by vm create without querying the image.
          p = Path("src/commands/ssh_tests.rs")
          text = p.read_text()
          marker = '''#[tokio::test]
          async fn ubuntu_images_use_the_ubuntu_login_name() {
          '''
          if "a_custom_launch_username_is_reused_by_vm_ssh" not in text:
              test = '''#[tokio::test]
          async fn a_custom_launch_username_is_reused_by_vm_ssh() {
              let mock = mock(Some("203.0.113.17"), "Oracle Linux").await;
              let mut instance: crate::oci::compute::Instance =
                  serde_json::from_value(instance_json()).expect("instance");
              instance
                  .freeform_tags
                  .insert("oci-free:ssh-user".to_owned(), "jacek".to_owned());
              let (user, warning) = default_user(&context(&mock), &instance).await;
              assert_eq!(user, "jacek");
              assert!(warning.is_none());
          }

          '''
              if marker not in text:
                  raise SystemExit("ssh_tests marker not found")
              p.write_text(text.replace(marker, test + marker, 1))

          # Exact URI regression for the live NSG action-path defect.
          p = Path("src/oci/network_tests.rs")
          text = p.read_text()
          if "nsg_rule_mutations_use_the_documented_action_paths" not in text:
              text += '''

          #[tokio::test]
          async fn nsg_rule_mutations_use_the_documented_action_paths() {
              use crate::testing::mock_oci::{MockOci, Reply};

              let nsg_id = "ocid1.networksecuritygroup.oc1.iad.actionpath";
              let mock = MockOci::builder()
                  .reply("POST", "actions/addSecurityRules", Reply::new(200, ""))
                  .reply("POST", "actions/removeSecurityRules", Reply::new(200, ""))
                  .start()
                  .await;
              let client = mock.client();
              let api = NetworkApi::new(&client);

              api.add_nsg_rules(
                  nsg_id,
                  vec![AddSecurityRule {
                      direction: "INGRESS".to_owned(),
                      protocol: "6".to_owned(),
                      source: Some("0.0.0.0/0".to_owned()),
                      source_type: Some("CIDR_BLOCK".to_owned()),
                      destination: None,
                      destination_type: None,
                      is_stateless: false,
                      tcp_options: Some(TransportOptions {
                          destination_port_range: Some(PortRange::exactly(443)),
                          source_port_range: None,
                      }),
                      udp_options: None,
                      description: Some("oci-free managed: 443/tcp".to_owned()),
                  }],
              )
              .await
              .expect("add rule");
              api.remove_nsg_rules(nsg_id, vec!["rule-1".to_owned()])
                  .await
                  .expect("remove rule");

              let writes = mock.writes();
              assert_eq!(writes.len(), 2);
              assert!(writes[0].target().ends_with(&format!(
                  "/20160918/networkSecurityGroups/{nsg_id}/actions/addSecurityRules"
              )));
              assert!(writes[1].target().ends_with(&format!(
                  "/20160918/networkSecurityGroups/{nsg_id}/actions/removeSecurityRules"
              )));
              for write in writes {
                  assert!(
                      !write.target().contains("/securityRules/actions/"),
                      "the list-rules subresource is not part of OCI's mutation action path: {}",
                      write.target()
                  );
              }
          }
          '''
              p.write_text(text)
          PY
          cargo fmt --all
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: finish reset and live OCI regressions"
          git push origin HEAD:feat/reset-host-customization
