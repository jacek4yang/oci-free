name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Cargo.lock is committed, so dependency drift must fail in CI rather
      # than being silently resolved during a release.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Build
        run: cargo build --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The shipped binary must carry no known advisory. Anything reachable
      # only through a dev-dependency is assessed in docs/SECURITY.md; a new
      # advisory fails the build so the assessment is made deliberately rather
      # than inherited.
      - name: Audit
        run: cargo audit --deny warnings
