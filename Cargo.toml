[package]
name = "oci-free"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A smart, free-first CLI for safely managing Oracle Cloud Free Tier resources"
license = "MIT"
repository = "https://github.com/jacek4yang/oci-free"
readme = "README.md"
keywords = ["oci", "oracle-cloud", "cli", "free-tier"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
