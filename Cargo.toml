[package]
name = "oci-free"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["jacek4yang"]
description = "A smart, free-first CLI for safely managing Oracle Cloud Free Tier resources"
license = "MIT"
repository = "https://github.com/jacek4yang/oci-free"
homepage = "https://github.com/jacek4yang/oci-free"
readme = "README.md"
keywords = ["oci", "oracle-cloud", "cli", "free-tier"]
categories = ["command-line-utilities"]
publish = false

# This application is distributed through GitHub Releases rather than crates.io.
# `dist = true` overrides cargo-dist's normal `publish = false` exclusion.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "902D0748-0155-4020-8744-EBDC0773F0AF"
path-guid = "A776BF7C-83D4-4E79-B142-73A383A763A3"
license = false
eula = false

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
# Interactive prompts only; no full-screen TUI (see CLAUDE.md).
dialoguer = { version = "0.12", default-features = false }
httpdate = "1.0"
md-5 = "0.11"
# rustls only: the binary must not depend on a system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "rustls-native-certs",
    "http2",
    "charset",
    "json",
] }
# rustls with the `ring` provider. reqwest's default `rustls` feature selects
# aws-lc-rs, which needs cmake and a C toolchain on every release runner; ring
# keeps all five target builds self-contained. The provider is installed
# explicitly at client construction because `rustls-no-provider` leaves the
# process default unset.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# RSA signing uses `ring`, not the RustCrypto `rsa` crate: RUSTSEC-2023-0071
# (the Marvin timing sidechannel) has no patched version, and its stated
# workaround is to avoid the crate. `ring` is already present as rustls's
# crypto provider, so this removes a dependency rather than adding one.
# See the module documentation in src/auth/key.rs.
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "process",
] }
url = "2.5"

[dev-dependencies]
# A self-signed certificate for the in-process HTTPS mock server. The transport
# refuses plaintext, so transport tests need real TLS rather than a plain
# socket. Test-only: none of this reaches the shipped binary.
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Release profile used by dist.
[profile.dist]
inherits = "release"
lto = "thin"
